<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Map the Windows fonts requested by DEKA print pages to TLWG Thai fonts that
  ship with `fonts-thai-tlwg`, so Chromium renders Thai text correctly:
    - Browallia New / Cordia New (looped sans)  -> Garuda
    - Angsana New                (looped serif) -> Norasi
  Also make Garuda the default Thai face for generic families.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Browallia New</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Garuda</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>BrowalliaUPC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Garuda</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Cordia New</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Garuda</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Angsana New</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Norasi</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>AngsanaUPC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Norasi</string></edit>
  </match>

  <!-- Generic-family fallbacks so any unmapped Thai text still resolves. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Garuda</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Norasi</family></prefer>
  </alias>
</fontconfig>
