services:
  gotenberg:
    build:
      context: .
      dockerfile: Dockerfile.gotenberg
    image: deka-gotenberg:8
    container_name: deka-gotenberg
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
